name: PayBot hardcoded Forge and NeoForge 1.21.1 v3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and smoke-test both loaders
        run: bash .github/scripts/run_paybot_hardcoded_forge_neoforge_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paybot-hardcoded-forge-neoforge-v3
          path: out-hardcoded/
          if-no-files-found: warn
