name: PayBot full patch MC 1.21.1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Clone PayBot source
        run: git clone --depth 1 https://github.com/ShirozNguyen/Paybot.git paybot

      - name: Apply Fabric 1.21.1 source port
        working-directory: paybot
        run: |
          python3 ../.github/scripts/patch_paybot_1211.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('common/src/main/java/com/naptien/compat/VanillaGuiBackend.java')
          s = p.read_text(encoding='utf-8')
          old = 'new ItemLore(lore.stream().map(Component::literal).toList())'
          new = 'new ItemLore(lore.stream().map(line -> (Component) Component.literal(line)).toList())'
          if old not in s:
              raise SystemExit('Missing ItemLore generic expression')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('fabric/build.gradle')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '    shadowCommon\n': '    shadowCommon\n    shade\n',
              '    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }\n':
                  '    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }\n\n'
                  "    implementation 'org.yaml:snakeyaml:2.2'\n"
                  "    implementation 'com.google.zxing:core:3.5.3'\n"
                  "    implementation 'com.google.zxing:javase:3.5.3'\n"
                  "    implementation 'org.nanohttpd:nanohttpd:2.3.1'\n\n"
                  "    shade 'org.yaml:snakeyaml:2.2'\n"
                  "    shade 'com.google.zxing:core:3.5.3'\n"
                  "    shade 'com.google.zxing:javase:3.5.3'\n"
                  "    shade 'org.nanohttpd:nanohttpd:2.3.1'\n",
              '    configurations = [project.configurations.shadowCommon]\n':
                  '    configurations = [project.configurations.shadowCommon, project.configurations.shade]\n',
              '    exclude "architectury.common.json"\n':
                  '    exclude "architectury.common.json"\n'
                  '    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"\n'
                  '    mergeServiceFiles()\n',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing build block: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build Fabric JAR
        working-directory: paybot
        run: gradle :fabric:build --stacktrace --no-daemon

      - name: Validate full patch JAR
        working-directory: paybot
        run: |
          JAR=$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR" >/dev/null
          zipinfo -1 "$JAR" > jar-entries.txt
          grep -Fxq 'fi/iki/elonen/NanoHTTPD.class' jar-entries.txt
          grep -Fxq 'com/google/zxing/MultiFormatWriter.class' jar-entries.txt
          grep -Fxq 'com/google/zxing/client/j2se/MatrixToImageWriter.class' jar-entries.txt
          grep -Fxq 'org/yaml/snakeyaml/Yaml.class' jar-entries.txt
          ! grep -Fq 'META-INF/jars/architectury-fabric-9.2.14.jar' jar-entries.txt
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Fabric-Minecraft-Version: 1.21.1'
          unzip -p "$JAR" fabric.mod.json | grep -q '"minecraft": "~1.21.1"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"architectury": ">=13.0.11"'

      - name: Smoke-test Fabric server startup
        working-directory: paybot
        run: |
          mkdir -p fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          cat > fabric/run/server.properties <<'EOF'
          online-mode=false
          server-port=25575
          view-distance=2
          simulation-distance=2
          generate-structures=false
          level-type=minecraft:flat
          motd=PayBot smoke test
          EOF

          rm -f smoke-input smoke.log smoke-ok
          mkfifo smoke-input
          exec 3<>smoke-input
          gradle :fabric:runServer --no-daemon < smoke-input > smoke.log 2>&1 &
          GPID=$!

          for i in $(seq 1 300); do
            if grep -q 'Done (' smoke.log; then
              touch smoke-ok
              sleep 8
              printf 'stop\n' >&3
              break
            fi
            if ! kill -0 "$GPID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          for i in $(seq 1 60); do
            if ! kill -0 "$GPID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$GPID" 2>/dev/null; then
            kill "$GPID" || true
          fi
          wait "$GPID" || true
          exec 3>&-

          tail -n 260 smoke.log
          test -f smoke-ok
          grep -q '\[PayBot\]' smoke.log
          ! grep -Eq 'NoSuchMethodError|NoClassDefFoundError: fi/iki/elonen/NanoHTTPD|Could not execute entrypoint stage.*paybot' smoke.log

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          find paybot/fabric/build/libs -maxdepth 1 -type f -name '*.jar' -print -exec cp {} out/ \; 2>/dev/null || true
          cp paybot/gradle.properties out/gradle.properties || true
          cp paybot/fabric/src/main/resources/fabric.mod.json out/fabric.mod.json || true
          cp paybot/smoke.log out/server-smoke.log 2>/dev/null || true
          tar -czf out/paybot-patched-source.tar.gz -C paybot common fabric build.gradle gradle.properties settings.gradle 2>/dev/null || true

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paybot-fullpatch-build
          path: out/
          if-no-files-found: warn
