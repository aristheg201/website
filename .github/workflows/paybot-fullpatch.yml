name: PayBot full patch MC 1.21.1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Clone PayBot source
        run: git clone --depth 1 https://github.com/ShirozNguyen/Paybot.git paybot

      - name: Apply Fabric 1.21.1 source port
        working-directory: paybot
        run: |
          python3 ../.github/scripts/patch_paybot_1211.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('common/src/main/java/com/naptien/compat/VanillaGuiBackend.java')
          s = p.read_text(encoding='utf-8')
          old = 'new ItemLore(lore.stream().map(Component::literal).toList())'
          new = 'new ItemLore(lore.stream().map(line -> (Component) Component.literal(line)).toList())'
          if old not in s:
              raise SystemExit('Missing ItemLore generic expression')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('fabric/build.gradle')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '    shadowCommon\n': '    shadowCommon\n    shade\n',
              '    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }\n':
                  '    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }\n\n'
                  "    shade 'org.yaml:snakeyaml:2.2'\n"
                  "    shade 'com.google.zxing:core:3.5.3'\n"
                  "    shade 'com.google.zxing:javase:3.5.3'\n"
                  "    shade 'org.nanohttpd:nanohttpd:2.3.1'\n",
              '    configurations = [project.configurations.shadowCommon]\n':
                  '    configurations = [project.configurations.shadowCommon, project.configurations.shade]\n',
              '    exclude "architectury.common.json"\n':
                  '    exclude "architectury.common.json"\n'
                  '    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"\n'
                  '    mergeServiceFiles()\n',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing shading build block: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build Fabric jar
        working-directory: paybot
        run: gradle :fabric:build --stacktrace --no-daemon

      - name: Validate full patch jar
        working-directory: paybot
        run: |
          JAR=$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -q 'fi/iki/elonen/NanoHTTPD.class'
          unzip -l "$JAR" | grep -q 'com/google/zxing/MultiFormatWriter.class'
          unzip -l "$JAR" | grep -q 'com/google/zxing/client/j2se/MatrixToImageWriter.class'
          unzip -l "$JAR" | grep -q 'org/yaml/snakeyaml/Yaml.class'
          ! unzip -l "$JAR" | grep -q 'META-INF/jars/architectury-fabric-9.2.14.jar'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Fabric-Minecraft-Version: 1.21.1'
          unzip -p "$JAR" fabric.mod.json | grep -q '"minecraft": "~1.21.1"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"architectury": ">=13.0.11"'

      - name: Collect build output
        if: always()
        run: |
          mkdir -p out
          find paybot/fabric/build/libs -maxdepth 1 -type f -name '*.jar' -print -exec cp {} out/ \; 2>/dev/null || true
          cp paybot/gradle.properties out/gradle.properties || true
          cp paybot/fabric/src/main/resources/fabric.mod.json out/fabric.mod.json || true
          tar -czf out/paybot-patched-source.tar.gz -C paybot common fabric build.gradle gradle.properties settings.gradle 2>/dev/null || true

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paybot-fullpatch-build
          path: out/
          if-no-files-found: warn
