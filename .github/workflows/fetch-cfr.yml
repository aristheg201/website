name: Fetch CFR decompiler

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download CFR 0.152
        run: |
          mkdir -p out
          curl -fL --retry 3 -o out/cfr-0.152.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          echo '8a85ada8cec494121246805a5562b82b  out/cfr-0.152.jar' | md5sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: cfr-0.152
          path: out/cfr-0.152.jar
