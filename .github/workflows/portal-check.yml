name: Check Poké Portal

on:
  push:
    branches: [feature/world-dex-launcher-v1, feature/cobblemon-1.8-dex-reindex]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Cobblemon 1.8 Dex data
        run: python3 scripts/build-cobblemon18-dex.py
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /website
