name: PayBot hardcoded Forge and NeoForge 1.21.1 v4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build and validate both production JARs
        run: |
          awk '/^smoke_test\(\) \{/{exit} {print}' .github/scripts/run_paybot_hardcoded_forge_neoforge_ci.sh > /tmp/paybot-build-only.sh
          bash /tmp/paybot-build-only.sh

      - name: Test on clean Forge and NeoForge production servers
        run: bash .github/scripts/prod_smoke_package_paybot_hardcoded.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paybot-hardcoded-forge-neoforge-production
          path: out-hardcoded/
          if-no-files-found: warn
