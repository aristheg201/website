name: PayBot full patch MC 1.21.1 v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Clone PayBot source
        run: git clone --depth 1 https://github.com/ShirozNguyen/Paybot.git paybot

      - name: Apply Fabric 1.21.1 source port and preserve 5.5.0 delta
        working-directory: paybot
        run: |
          python3 ../.github/scripts/patch_paybot_1211.py
          python3 ../.github/scripts/merge_paybot_550.py
          python3 - <<'PY'
          from pathlib import Path

          # Java generic inference fix for ItemLore in 1.21.1.
          p = Path('common/src/main/java/com/naptien/compat/VanillaGuiBackend.java')
          s = p.read_text(encoding='utf-8')
          old = 'new ItemLore(lore.stream().map(Component::literal).toList())'
          new = 'new ItemLore(lore.stream().map(line -> (Component) Component.literal(line)).toList())'
          if old not in s:
              raise SystemExit('Missing ItemLore generic expression')
          p.write_text(s.replace(old, new), encoding='utf-8')

          # Correct Quilt metadata as well as Fabric metadata.
          p = Path('fabric/src/main/resources/quilt.mod.json')
          s = p.read_text(encoding='utf-8')
          old = '''      {
                "id": "minecraft",
                "versions": ">=1.14.4"
              }'''
          new = '''      {
                "id": "minecraft",
                "versions": "~1.21.1"
              },
              {
                "id": "architectury",
                "versions": ">=13.0.11"
              }'''
          if old not in s:
              raise SystemExit('Missing Quilt Minecraft dependency block')
          p.write_text(s.replace(old, new), encoding='utf-8')

          # Build a self-contained production JAR. Driver versions match the
          # server modpack to avoid classpath version conflicts.
          p = Path('fabric/build.gradle')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '    shadowCommon\n': '    shadowCommon\n    shade\n',
              '    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }\n':
                  '    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }\n\n'
                  "    implementation 'org.yaml:snakeyaml:2.2'\n"
                  "    implementation 'com.google.zxing:core:3.5.3'\n"
                  "    implementation 'com.google.zxing:javase:3.5.3'\n"
                  "    implementation 'org.nanohttpd:nanohttpd:2.3.1'\n"
                  "    implementation('org.xerial:sqlite-jdbc:3.49.1.0') { transitive = false }\n"
                  "    implementation('com.mysql:mysql-connector-j:9.2.0') { transitive = false }\n\n"
                  "    shade 'org.yaml:snakeyaml:2.2'\n"
                  "    shade 'com.google.zxing:core:3.5.3'\n"
                  "    shade 'com.google.zxing:javase:3.5.3'\n"
                  "    shade 'org.nanohttpd:nanohttpd:2.3.1'\n"
                  "    shade('org.xerial:sqlite-jdbc:3.49.1.0') { transitive = false }\n"
                  "    shade('com.mysql:mysql-connector-j:9.2.0') { transitive = false }\n",
              '    configurations = [project.configurations.shadowCommon]\n':
                  '    configurations = [project.configurations.shadowCommon, project.configurations.shade]\n',
              '    exclude "architectury.common.json"\n':
                  '    exclude "architectury.common.json"\n'
                  '    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"\n'
                  '    mergeServiceFiles()\n',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing build block: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build Fabric JAR
        working-directory: paybot
        run: gradle :fabric:build --stacktrace --no-daemon

      - name: Validate production JAR structure and mappings
        working-directory: paybot
        run: |
          JAR=$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR" >/dev/null
          zipinfo -1 "$JAR" > jar-entries.txt

          grep -Fxq 'fi/iki/elonen/NanoHTTPD.class' jar-entries.txt
          grep -Fxq 'com/google/zxing/MultiFormatWriter.class' jar-entries.txt
          grep -Fxq 'com/google/zxing/client/j2se/MatrixToImageWriter.class' jar-entries.txt
          grep -Fxq 'org/yaml/snakeyaml/Yaml.class' jar-entries.txt
          grep -Fxq 'org/sqlite/JDBC.class' jar-entries.txt
          grep -Fxq 'com/mysql/cj/jdbc/Driver.class' jar-entries.txt
          grep -Eq '^org/sqlite/native/Linux/.*/libsqlitejdbc\.so$' jar-entries.txt

          ! grep -Fq 'META-INF/jars/architectury-fabric-9.2.14.jar' jar-entries.txt
          ! unzip -p "$JAR" com/naptien/PayBotMod.class | strings | grep -Fxq 'method_7985'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Fabric-Minecraft-Version: 1.21.1'
          unzip -p "$JAR" fabric.mod.json | grep -q '"minecraft": "~1.21.1"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"architectury": ">=13.0.11"'
          unzip -p "$JAR" quilt.mod.json | grep -q '"versions": "~1.21.1"'
          unzip -p "$JAR" config-template.yml | grep -q '^custom-lore:'
          unzip -p "$JAR" com/naptien/commands/CommandRegistry.class | strings | grep -Fxq 'paybotreload'

      - name: Test embedded libraries and JDBC drivers
        working-directory: paybot
        run: |
          JAR=$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' | head -n 1)
          cat > DependencySmoke.java <<'JAVA'
          import java.sql.*;
          import org.yaml.snakeyaml.Yaml;
          import com.google.zxing.*;
          import com.google.zxing.qrcode.QRCodeWriter;

          public final class DependencySmoke {
              public static void main(String[] args) throws Exception {
                  Class.forName("fi.iki.elonen.NanoHTTPD");
                  Class.forName("com.mysql.cj.jdbc.Driver");
                  Class.forName("org.sqlite.JDBC");
                  try (Connection c = DriverManager.getConnection("jdbc:sqlite::memory:");
                       Statement st = c.createStatement()) {
                      st.execute("CREATE TABLE smoke (v INTEGER)");
                      st.execute("INSERT INTO smoke VALUES (21)");
                      try (ResultSet rs = st.executeQuery("SELECT v FROM smoke")) {
                          if (!rs.next() || rs.getInt(1) != 21) throw new IllegalStateException("SQLite smoke failed");
                      }
                  }
                  Object parsed = new Yaml().load("ok: true");
                  if (parsed == null) throw new IllegalStateException("SnakeYAML smoke failed");
                  if (new QRCodeWriter().encode("PayBot", BarcodeFormat.QR_CODE, 64, 64).getWidth() != 64)
                      throw new IllegalStateException("ZXing smoke failed");
                  System.out.println("DEPENDENCY_SMOKE_OK");
              }
          }
          JAVA
          javac -cp "$JAR" DependencySmoke.java
          java -cp "$JAR:." DependencySmoke | tee dependency-smoke.log
          grep -q 'DEPENDENCY_SMOKE_OK' dependency-smoke.log

      - name: Smoke-test Fabric server startup with SQLite
        working-directory: paybot
        run: |
          mkdir -p fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          cat > fabric/run/server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          server-port=25575
          view-distance=2
          simulation-distance=2
          generate-structures=false
          level-type=minecraft:flat
          motd=PayBot smoke test
          EOF

          rm -f smoke-input smoke.log smoke-ok
          mkfifo smoke-input
          exec 3<>smoke-input
          gradle :fabric:runServer --no-daemon < smoke-input > smoke.log 2>&1 &
          GPID=$!

          for i in $(seq 1 300); do
            if grep -q 'Kết nối SQLite thành công' smoke.log && grep -q 'Done (' smoke.log; then
              touch smoke-ok
              sleep 8
              printf 'stop\n' >&3
              break
            fi
            if ! kill -0 "$GPID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          for i in $(seq 1 60); do
            if ! kill -0 "$GPID" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$GPID" 2>/dev/null; then kill "$GPID" || true; fi
          wait "$GPID" || true
          exec 3>&-

          tail -n 300 smoke.log
          test -f smoke-ok
          grep -q '\[PayBot\]' smoke.log
          grep -q 'Kết nối SQLite thành công' smoke.log
          ! grep -Eq 'NoSuchMethodError|NoClassDefFoundError|ClassNotFoundException: org\.sqlite\.JDBC|Could not execute entrypoint stage.*paybot' smoke.log

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          JAR=$(find paybot/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' | head -n 1)
          if [ -n "$JAR" ]; then
            cp "$JAR" out/PayBot-Mod-Fabric-Quilt-5.5.0-MC1.21.1-FULLPATCH.jar
            sha256sum out/PayBot-Mod-Fabric-Quilt-5.5.0-MC1.21.1-FULLPATCH.jar > out/SHA256.txt
          fi
          cp paybot/fabric/src/main/resources/fabric.mod.json out/fabric.mod.json 2>/dev/null || true
          cp paybot/fabric/src/main/resources/quilt.mod.json out/quilt.mod.json 2>/dev/null || true
          cp paybot/dependency-smoke.log out/dependency-smoke.log 2>/dev/null || true
          cp paybot/smoke.log out/server-smoke.log 2>/dev/null || true
          tar -czf out/paybot-patched-source.tar.gz -C paybot common fabric build.gradle gradle.properties settings.gradle 2>/dev/null || true

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paybot-fullpatch-v2
          path: out/
          if-no-files-found: error
